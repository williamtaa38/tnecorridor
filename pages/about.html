<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>About | TNE Corridor</title>

  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/about.css" />

  <script src="/js/layout.js" defer></script>
  <script src="/js/about.js" defer></script>
</head>

<body>
  <div id="site-header"></div>

  <main class="about-page">
    <section class="about-hero">
      <div class="about-glow about-glow-blue"></div>
      <div class="about-glow about-glow-gold"></div>

      <div class="about-wrap">

        <!-- PHOTO 1 -->
        <div class="about-photo-card">
          <img
            src="/resources/12.png"
            alt="Together, We Build the Future of Global Education"
            class="about-flow-image"
          />
        </div>

        <!-- PHOTO 2 -->
        <div class="about-photo-card" >
          <img
            src="/resources/9.png"
            alt="Explore UK Pathways"
            class="about-flow-image"
          />
        </div>

        <!-- PHOTO 3 -->
        <div class="about-photo-card" >
          <img
            src="/resources/13.png"
            alt="Ask EduSeek AI"
            class="about-flow-image"
          />
        </div>

        <!-- PHOTO 4 -->
        <div class="about-photo-card" >
          <img
            src="/resources/14.png"
            alt="Talk to Advisor"
            class="about-flow-image"
          />
        </div>

        <!-- FINAL 3 BUTTONS -->
        <div class="about-final-buttons" aria-label="About page action buttons">
          <a href="/pages/programmes.html" class="about-final-btn about-final-btn-green">
            <span class="about-btn-icon">↗</span>
            <span>Explore UK Pathways</span>
          </a>

          <button type="button" class="about-final-btn about-final-btn-purple" data-action="ask-ai">
            <span class="about-btn-icon">✦</span>
            <span>Ask EduSeek AI</span>
          </button>

          <a href="/pages/register.html" class="about-final-btn about-final-btn-blue">
            <span class="about-btn-icon">☏</span>
            <span>Talk to Advisor</span>
          </a>
        </div>

      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
