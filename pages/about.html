<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EduSeek | TNE Corridor</title>

  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/about.css" />

  <script src="/js/layout.js" defer></script>
  <script src="/js/about.js" defer></script>
</head>

<body>
  <div id="site-header"></div>

  <main class="resource-page">
    <section class="resource-hero">
      <div class="resource-glow resource-glow-blue"></div>
      <div class="resource-glow resource-glow-gold"></div>

      <div class="resource-wrap">
        <div class="resource-preview">
          <img
            src="/resources/12.png"
            alt="Together, We Build the Future of Global Education"
            class="resource-main-image"
          />
        </div>

        <div class="resource-bottom-buttons" aria-label="EduSeek action buttons">
          <a href="/" class="resource-image-button" aria-label="Home">
            <img src="/resources/12.png" alt="Together, We Build the Future of Global Education" />
          </a>

          <a href="/pages/programmes.html" class="resource-image-button" aria-label="Explore UK Pathways">
            <img src="/resources/9.png" alt="Explore UK Pathways" />
          </a>

          <button type="button" class="resource-image-button" data-action="ask-ai" aria-label="Ask EduSeek AI">
            <img src="/resources/13.png" alt="Ask EduSeek AI" />
          </button>

          <a href="/pages/register.html" class="resource-image-button" aria-label="Talk to Advisor">
            <img src="/resources/14.png" alt="Talk to Advisor" />
          </a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
